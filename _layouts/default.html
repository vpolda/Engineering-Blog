<!DOCTYPE html>
<html>
  <head>
    <script src="https://unpkg.com/mermaid@8.13.5/dist/mermaid.min.js"></script>
  </head>

  {% include head.html %}

  <body>

    {% include header.html %}

    <div class="page-content">
        {{ content }}
    </div>

    {% include footer.html %}
    
    <script>
      var config = {
          startOnLoad:true,
          theme: 'neutral',
          flowchart:{
                  useMaxWidth:false,
                  htmlLabels:true
              }
      };
      mermaid.initialize(config);
      window.mermaid.init(undefined, document.querySelectorAll('.language-mermaid'));
      </script>
    

  </body>

</html>
